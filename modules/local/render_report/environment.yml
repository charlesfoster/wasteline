---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
channels:
  - conda-forge
  - bioconda
dependencies:
  # Source of truth for the report renderer (bin/render_report.py needs python >= 3.10 + jinja2).
  # The interim container (multiqc biocontainer) ships jinja2 3.1.6; keep this pin equal to it.
  - conda-forge::python=3.12.12
  - conda-forge::jinja2=3.1.6
